  deploy-hosting:
    runs-on:
      ubuntu-latest
#    needs: build-test
#    if: ${{ always() && needs.build-test.result == 'success' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ gitverse.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKER_USERNAME }}/mkdocs-task-gitverse:${{ github.sha }}

      - name: Deploy with SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh "$SSH_USER@$SSH_HOST" '
            docker stop mkdocs-app-gitverse 2>/dev/null || true
            docker rm mkdocs-app-gitverse 2>/dev/null || true
            docker run -d -p 7000:7000 --name mkdocs-app-gitverse ${{ secrets.DOCKER_USERNAME }}/mkdocs-task-gitverse:${{ github.sha }}


