  deploy-hosting:
    runs-on:
      ubuntu-latest
#    needs: build-test
#    if: ${{ always() && needs.build-test.result == 'success' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ gitverse.ref_name }}

      - name: Prepare Kaniko credentials for Docker Hub
        run: |
          mkdir -p "${{ gitverse.workspace }}/.docker"
          AUTH=$(echo -n "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_TOKEN }}" | base64 -w0)
          cat > "${{ gitverse.workspace }}/.docker/config.json" <<EOF
          {
            "auths": {
              "https://index.docker.io/v1/": {
                  "auth": "${AUTH}"
                }
            }
          }
          EOF
          chmod 600 "${{ gitverse.workspace }}/.docker/config.json"
          echo "✅ Created config at ${{ gitverse.workspace }}/.docker/config.json"
        shell: bash

      - name: Kaniko build and push to Evolution Artifact Registry
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        with:
            args: >-
              --context=dir://${{ gitverse.workspace }}
              --dockerfile=Dockerfile
              --destination=docker.io/${{ secrets.DOCKER_USERNAME }}/mkdocs-app-gitverse:${{ gitverse.sha }}
              --verbosity=info

      - name: Deploy with SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh "$SSH_USER@$SSH_HOST" '
            docker stop mkdocs-app-gitverse 2>/dev/null || true
            docker rm mkdocs-app-gitverse 2>/dev/null || true
            docker run -d -p 7000:7000 --name mkdocs-app-gitverse ${{ secrets.DOCKER_USERNAME }}/mkdocs-app-gitverse:${{ gitverse.sha }}
          '


