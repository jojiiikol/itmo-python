name: main_CI
on:
  push:
    branches:
      - '**'

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      generator_changed: ${{ steps.filter.outputs.generator }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            generator:
              - 'task/docs/scripts/**'
              - 'task/docs/t2.md'

  generate-data:
    runs-on: ubuntu-latest
    needs: check-changes
    if: ${{ needs.check-changes.outputs.generator_changed == 'true' }}
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: python_install
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.3'
          cache: 'pip'
          cache-dependency-path: ./requirements.txt

      - name: requirements_install
        run: pip install -r requirements.txt

      - name: generate-data
        run: |
          cd ./task
          python docs/scripts/generate_data.py

      - name: nbconvert
        run: |
          cd ./task
          jupyter nbconvert --execute docs/scripts/graphics.ipynb --to markdown --output-dir docs/static/nbconvert_files

      - name: papermill
        run: |
          cd ./task
          papermill docs/scripts/parametrize_graphics.ipynb docs/scripts/parametrize_graphics_1.ipynb -p X_MIN -600 -p X_MAX 5 -p N 100
          papermill docs/scripts/parametrize_graphics.ipynb docs/scripts/parametrize_graphics_2.ipynb -p X_MIN -10 -p X_MAX 10 -p N 2
          papermill docs/scripts/parametrize_graphics.ipynb docs/scripts/parametrize_graphics_3.ipynb -p X_MIN -100 -p X_MAX 100 -p N 10

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "generate data: generate new data [skip ci]"
          git push



  build-test:
    runs-on: ubuntu-latest
    needs: [ check-changes, generate-data ]
    if: always() && (needs.generate-data.result == 'success' || needs.generate-data.result == 'skipped')
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ gitverse.ref_name }}

      - name: python_install
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.3'
          cache: 'pip'
          cache-dependency-path: ./requirements.txt

      - name: requirements_install
        run: pip install -r requirements.txt

      - name: build_static
        run: |
          cd ./task
          mkdocs build --strict

      - name: upload_artifacts
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./task/site


  deploy-gh:
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ always() && needs.build-test.result == 'success' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.23'

      - name: Deploy to GitVerse Pages
        id: deployment
        uses: actions/deploy-pages@v1
        with:
          artifact_name: gitverse-pages

      - name: Print deploy URL
        run: echo "🌐 page_url = ${{ steps.deployment.outputs.page_url }}"

  deploy-to-helios:
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ always() && needs.build-test.result == 'success' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: gitverse-pages
          path: ./site-artifact

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HELIOS_HOST }}
          username: ${{ secrets.HELIOS_USER }}
          key: ${{ secrets.HELIOS_SSH_KEY }}
          port: ${{ 2222 }}
          source: "./workspace/jojiikol/itmo-python/site-artifact/*"
          target: "./public_html/mkdocs"
          strip_prefix: "site-files"