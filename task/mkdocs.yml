site_name: Исследовательские материалы
site_description: Публикация результатов исследований и практических заданий
nav:
  - Home: index.md
  - Verse: Vladimir.md
  - Сравнения подходов к публикации: comparison.md
  - T2. Анализ конвейера «эксперимент → артефакт → страница»: t2.md
theme:
  name: material
  language: ru

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: true
      cache: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js