site_name: Исследовательские материалы
site_description: Публикация результатов исследований и практических заданий
nav:
  - Home: index.md
  - Сравнения подходов к публикации: comparison.md
  - T2. Анализ конвейера «эксперимент → артефакт → страница»: t2.md
  - P1. CI/CD-пайплайн на отечественном сервисе: p1.md
  - P4. Развёртывание на Helios с контролем качества доставки: p4.md
  - Hermes. Развертывание ИИ агента: agent.md
  - Экспериментальный стенд: analyze_articles.md
theme:
  name: material
  language: ru

plugins:
  - search
  - mermaid2
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: true
      cache: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js