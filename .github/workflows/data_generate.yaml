name: data-generate
on:
  workflow_call:

jobs:
  generate:
    runs-on:
      ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: python_install
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.3'
          cache: 'pip'
          cache-dependency-path: ./requirements.txt

      - name: requirements_install
        run: pip install -r requirements.txt

      - name: generate-data
        run: |
          cd ./task 
          python docs/scripts/generate_data.py

      - name: generate-image
        run: |
          cd ./task
          jupyter nbconvert docs/scripts/graphics.ipynb --to markdown --output-dir docs/static/nbconvert_files

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "generate data: generate new data [skip ci]"
          git push
