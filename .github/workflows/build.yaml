name: build
on:
  workflow_call:

jobs:
  build:
    runs-on:
      ubuntu-latest
    steps:
      - name: python_install
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.3'
          cache: 'pip'
          cache-dependency-path: /requirements.txt

      - name: requirements_install
        run: pip install -r requirements.txt

      - name: test
        run: mkdocs build --strict
