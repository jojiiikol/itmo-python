name: main_CI
on:
  push:
    branches:
      - 'main'

jobs:
  build-test:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml

  deploy-gh:
    needs: build-test
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_gh.yaml


